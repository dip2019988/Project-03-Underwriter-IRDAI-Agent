version: "3.9"

services:

  insurance-underwriter-api:

    build:
      context: .
      dockerfile: Dockerfile

    container_name: insurance-underwriter-api

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379

    depends_on:
      redis:
        condition: service_started

    restart: unless-stopped

  redis:

    image: redis:7-alpine

    container_name: insurance-underwriter-redis

    ports:
      - "6379:6379"

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5