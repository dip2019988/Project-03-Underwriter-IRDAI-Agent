name: Insurance Underwriter CI/CD

on: #When the pipeline should be triggered
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # -------------------------------------------------------------------
  # 1. Code Quality & Linting
  # -------------------------------------------------------------------
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest #which server platform this pipeline should be execute on
    steps:
      - name: Checkout Code #Pull code from repository
        uses: actions/checkout@v4 #extension/plugin to perform the task

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Linting Tools
        run: pip install ruff #Ruff is Python Linter tool

      - name: Run Ruff Linter
        run: ruff check . --ignore B008,BLE001,RUF012,DTZ003,PERF102,PLW1510,RUF013

  # -------------------------------------------------------------------
  # 2. Unit, Security & Guardrail Testing
  # -------------------------------------------------------------------
  test:
    name: Unit & Security Guardrail Tests
    runs-on: ubuntu-latest
    needs: lint #means this job will not be started unless lint job is completed
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }} #Fetching from GitHub Secrets
      LANGCHAIN_TRACING_V2: "false"
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY || 'default-ci-test-jwt-secret-key-32b' }}
      REDIS_HOST: localhost
      REDIS_PORT: 6379

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m spacy download en_core_web_sm

      - name: Execute Pytest Suite
        env:
          PYTHONPATH: .
        run: |
          python -m pytest tests/ -v

  # -------------------------------------------------------------------
  # 3. Application startup checks
  # -------------------------------------------------------------------

  startup-check:
    name: Application Startup Validation
    runs-on: ubuntu-latest
    needs: test

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY || 'default-ci-test-jwt-secret-key-32b' }}
      REDIS_HOST: localhost
      REDIS_PORT: 6379

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Verify FastAPI Startup
        env:
          PYTHONPATH: .
        run: |
          python -c "from api_server import app; print('Startup Validation Passed')"

  # -------------------------------------------------------------------
  # 4. LangSmith Evaluation Regression Gate
  # -------------------------------------------------------------------
  langsmith-eval:
    name: LangSmith LLM-as-a-Judge Evaluation Gate
    runs-on: ubuntu-latest
    needs: startup-check
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LANGCHAIN_TRACING_V2: "true"
      CI_AUTOMATION: "true"
      LANGCHAIN_API_KEY: ${{ secrets.LANGCHAIN_API_KEY }}
      LANGCHAIN_PROJECT: ${{ secrets.LANGCHAIN_PROJECT || 'Enterprise-Incident-Agent-CI' }}
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY || 'default-ci-test-jwt-secret-key-32b' }}
      REDIS_HOST: localhost
      REDIS_PORT: 6379

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          python -m spacy download en_core_web_sm

      - name: Start MCP Services
        run: |
          nohup python mcp_services/bmi_service.py > bmi.log 2>&1 &
          nohup python mcp_services/hlv_service.py > hlv.log 2>&1 &
          nohup python mcp_services/premium_service.py > premium.log 2>&1 &

          sleep 10

          echo "=== BMI LOG ==="
          cat bmi.log || true
          
          echo "=== HLV LOG ==="
          cat hlv.log || true

          echo "=== PREMIUM LOG ==="
          cat premium.log || true

      - name: Verify MCP Services
        run: |
          curl http://localhost:8001/health
          curl http://localhost:8002/health
          curl http://localhost:8003/health

      - name: Run LangSmith Evaluation Runner
        env:
          PYTHONPATH: .
        run: |
          python evals/run_evals.py

  # -------------------------------------------------------------------
  # 5. Container Build & Packaging
  # -------------------------------------------------------------------
  docker-build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: startup-check

    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/insurance-underwriter:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/insurance-underwriter:${{ github.sha }}

  # -------------------------------------------------------------------
  # 6. Deployment Verification
  # -------------------------------------------------------------------

  deployment-verification:

    name: Deployment Verification

    runs-on: ubuntu-latest

    needs: docker-build-and-push

    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    steps:

      - name: Verify Docker Image Published

        run: |

          echo "Docker image successfully pushed."

          echo "Repository:"
          echo "${{ secrets.DOCKERHUB_USERNAME }}/insurance-underwriter"

          echo "Tag:"
          echo "latest"

          echo "Deployment verification passed."          